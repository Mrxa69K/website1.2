          </head>
          <body>
              <!-- Login Section -->
              <div id="loginSection" class="login-box">
                  <h2 class="text-center mb-4">Admin Login</h2>
                  <form id="loginForm">
                      <div class="mb-3">
                          <label class="form-label">Email</label>
                          <input type="email" id="loginEmail" class="form-control" required>
                      </div>
                      <div class="mb-3">
                          <label class="form-label">Password</label>
                          <input type="password" id="loginPassword" class="form-control" required>
                      </div>
                      <button type="submit" class="btn btn-primary w-100">Login</button>
                  </form>
                  <div id="loginError" class="alert alert-danger mt-3 hidden"></div>
              </div>

              <!-- Admin Dashboard -->
              <div id="adminSection" class="admin-container hidden">
                  <div class="d-flex justify-content-between align-items-center mb-4">
                      <h1>Portfolio Admin</h1>
                      <button onclick="logout()" class="btn btn-outline-danger">
                          <i class="fas fa-sign-out-alt"></i> Logout
                      </button>
                  </div>

                  <!-- Add/Edit Photo Form -->
                  <div class="form-section">
                      <h3 id="formTitle">Add New Photo</h3>
                      <form id="photoForm">
                          <input type="hidden" id="photoId">
