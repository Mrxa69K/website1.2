          - Added Supabase configuration with credentials
          - Created portfolio loader for dynamic photos
          - Updated portfolio pages with data-category attributes
          - Added documentation for setup"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ Supabase Integration Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Created:" >> $GITHUB_STEP_SUMMARY
          echo "- \`WEBSITE/final-version/admin.html\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`WEBSITE/final-version/js/admin.js\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`WEBSITE/final-version/js/supabase-config.js\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`WEBSITE/final-version/js/portfolio-loader.js\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Check \`SUPABASE_SETUP.md\` for database setup SQL" >> $GITHUB_STEP_SUMMARY
          echo "2. Create admin user in Supabase Authentication" >> $GITHUB_STEP_SUMMARY
          echo "3. Deploy to your website" >> $GITHUB_STEP_SUMMARY
          echo "4. Access admin panel at \`/admin.html\`" >> $GITHUB_STEP_SUMMARY
