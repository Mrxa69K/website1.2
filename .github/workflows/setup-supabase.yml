      - name: Create admin JavaScript
        run: |
          mkdir -p WEBSITE/final-version/js
          cat > WEBSITE/final-version/js/admin.js << 'EOF'
          // Initialize Supabase
          const supabase = window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

          // Check authentication on page load
          window.addEventListener('DOMContentLoaded', async () => {
              const { data: { session } } = await supabase.auth.getSession();
              
              if (session) {
                  showAdminPanel();
                  loadPhotos();
              } else {
                  showLogin();
              }
          });

          // Login
          document.getElementById('loginForm').addEventListener('submit', async (e) => {
              e.preventDefault();
              
              const email = document.getElementById('loginEmail').value;
              const password = document.getElementById('loginPassword').value;
              const errorDiv = document.getElementById('loginError');
              
              const { data, error } = await supabase.auth.signInWithPassword({
                  email,
                  password
              });
              
              if (error) {
                  errorDiv.textContent = error.message;
                  errorDiv.classList.remove('hidden');
              } else {
                  showAdminPanel();
                  loadPhotos();
              }
          });

          // Logout
          async function logout() {
              await supabase.auth.signOut();
              showLogin();
          }

          // Show/Hide sections
          function showLogin() {
              document.getElementById('loginSection').classList.remove('hidden');
              document.getElementById('adminSection').classList.add('hidden');
          }

          function showAdminPanel() {
              document.getElementById('loginSection').classList.add('hidden');
              document.getElementById('adminSection').classList.remove('hidden');
          }

          // Photo Form Submit
          document.getElementById('photoForm').addEventListener('submit', async (e) => {
              e.preventDefault();
              
              const submitBtn = document.getElementById('submitBtn');
              submitBtn.disabled = true;
              submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
              
              const photoId = document.getElementById('photoId').value;
              const photoFile = document.getElementById('photoFile').files[0];
              const currentImageUrl = document.getElementById('currentImageUrl').value;
              
              let imageUrl = currentImageUrl;
              
              // Upload image if new file selected
              if (photoFile) {
                  const fileExt = photoFile.name.split('.').pop();
                  const fileName = `${Date.now()}-${Math.random().toString(36).substring(7)}.${fileExt}`;
                  
                  const { data: uploadData, error: uploadError } = await supabase.storage
                      .from('photos')
                      .upload(fileName, photoFile);
                  
                  if (uploadError) {
                      alert('Error uploading image: ' + uploadError.message);
                      submitBtn.disabled = false;
                      submitBtn.innerHTML = '<i class="fas fa-save"></i> Save Photo';
                      return;
                  }
                  
                  const { data: { publicUrl } } = supabase.storage
                      .from('photos')
                      .getPublicUrl(fileName);
                  
                  imageUrl = publicUrl;
              }
              
              const photoData = {
                  title: document.getElementById('photoTitle').value,
                  description: document.getElementById('photoDescription').value,
                  category: document.getElementById('photoCategory').value,
                  order_index: parseInt(document.getElementById('photoOrder').value),
                  image_url: imageUrl,
                  updated_at: new Date().toISOString()
              };
              
              if (photoId) {
                  const { error } = await supabase
                      .from('photos')
                      .update(photoData)
                      .eq('id', photoId);
                  
                  if (error) {
                      alert('Error updating photo: ' + error.message);
                  } else {
                      alert('Photo updated successfully!');
                      resetForm();
                      loadPhotos();
                  }
              } else {
                  const { error } = await supabase
                      .from('photos')
                      .insert([photoData]);
                  
                  if (error) {
                      alert('Error adding photo: ' + error.message);
                  } else {
                      alert('Photo added successfully!');
                      resetForm();
                      loadPhotos();
                  }
              }
              
              submitBtn.disabled = false;
              submitBtn.innerHTML = '<i class="fas fa-save"></i> Save Photo';
          });

          // Image preview
          document.getElementById('photoFile').addEventListener('change', (e) => {
              const file = e.target.files[0];
              if (file) {
                  const reader = new FileReader();
                  reader.onload = (e) => {
                      const preview = document.getElementById('previewImage');
                      preview.src = e.target.result;
                      preview.classList.remove('hidden');
                  };
                  reader.readAsDataURL(file);
              }
          });

          // Load photos from database
          async function loadPhotos() {
              const { data: photos, error } = await supabase
                  .from('photos')
                  .select('*')
                  .order('order_index', { ascending: true });
              
              if (error) {
                  console.error('Error loading photos:', error);
                  return;
              }
              
              const grid = document.getElementById('photosGrid');
              grid.innerHTML = '';
              
              photos.forEach(photo => {
                  const card = document.createElement('div');
                  card.className = 'col-md-4';
                  card.innerHTML = `
                      <div class="photo-card">
                          <img src="${photo.image_url}" alt="${photo.title}">
                          <h5 class="mt-2">${photo.title}</h5>
                          <p class="text-muted">${photo.description || ''}</p>
                          <span class="badge bg-primary">${photo.category}</span>
                          <span class="badge bg-secondary">Order: ${photo.order_index}</span>
                          <div class="mt-3">
                              <button class="btn btn-sm btn-warning" onclick='editPhoto(${JSON.stringify(photo)})'>
                                  <i class="fas fa-edit"></i> Edit
                              </button>
                              <button class="btn btn-sm btn-danger" onclick="deletePhoto('${photo.id}')">
                                  <i class="fas fa-trash"></i> Delete
                              </button>
                          </div>
                      </div>
                  `;
                  grid.appendChild(card);
              });
          }

          // Edit photo
          function editPhoto(photo) {
              document.getElementById('formTitle').textContent = 'Edit Photo';
              document.getElementById('photoId').value = photo.id;
              document.getElementById('photoTitle').value = photo.title;
              document.getElementById('photoDescription').value = photo.description || '';
              document.getElementById('photoCategory').value = photo.category;
              document.getElementById('photoOrder').value = photo.order_index;
              document.getElementById('currentImageUrl').value = photo.image_url;
              
              const preview = document.getElementById('previewImage');
              preview.src = photo.image_url;
              preview.classList.remove('hidden');
              
              window.scrollTo({ top: 0, behavior: 'smooth' });
          }

          // Delete photo
          async function deletePhoto(id) {
              if (!confirm('Are you sure you want to delete this photo?')) return;
              
              const { error } = await supabase
                  .from('photos')
                  .delete()
                  .eq('id', id);
              
              if (error) {
                  alert('Error deleting photo: ' + error.message);
              } else {
                  alert('Photo deleted successfully!');
                  loadPhotos();
              }
          }

          // Reset form
          function resetForm() {
              document.getElementById('formTitle').textContent = 'Add New Photo';
              document.getElementById('photoForm').reset();
              document.getElementById('photoId').value = '';
              document.getElementById('currentImageUrl').value = '';
              document.getElementById('previewImage').classList.add('hidden');
          }
          EOF
          echo "✅ Created admin.js"
      
      - name: Run setup script
        run: |
          python3 setup_supabase_integration.py
      
      - name: Create README for admin
        run: |
          cat > WEBSITE/final-version/SUPABASE_SETUP.md << 'EOF'
          # Supabase Admin Panel Setup

          ## ✅ Files Created

          - `admin.html` - Admin panel interface
          - `js/admin.js` - Admin panel logic
          - `js/supabase-config.js` - Supabase credentials
          - `js/portfolio-loader.js` - Dynamic photo loader for portfolio pages

          ## 🔧 Supabase Configuration

          Your Supabase project is configured with:
          - **URL**: https://yspjuakdfukoawjjiulb.supabase.co
          - **Anon Key**: sb_publishable_7F_MmEp9qZtlYIF8imba4g_1KrhBzga

          ## 📋 Next Steps

          ### 1. Set up Supabase Database

          Go to your Supabase project SQL Editor and run:

          ```sql
          -- Create photos table
          create table photos (
            id uuid default gen_random_uuid() primary key,
            title text not null,
            description text,
            image_url text not null,
            category text,
            order_index integer default 0,
            created_at timestamp with time zone default now(),
            updated_at timestamp with time zone default now()
          );

          -- Enable RLS
          alter table photos enable row level security;

          -- Public can read
          create policy "Anyone can view photos"
            on photos for select
            using (true);

          -- Authenticated can modify
          create policy "Authenticated users can insert"
            on photos for insert
            with check (auth.role() = 'authenticated');

          create policy "Authenticated users can update"
            on photos for update
            using (auth.role() = 'authenticated');

          create policy "Authenticated users can delete"
            on photos for delete
            using (auth.role() = 'authenticated');
          ```

          ### 2. Create Storage Bucket

          1. Go to Storage in Supabase
          2. Create a new bucket called `photos`
          3. Make it public
          4. Add these policies in SQL Editor:

          ```sql
          -- Storage policies
          create policy "Anyone can view photos in storage"
            on storage.objects for select
            using (bucket_id = 'photos');

          create policy "Authenticated users can upload"
            on storage.objects for insert
            with check (bucket_id = 'photos' and auth.role() = 'authenticated');

          create policy "Authenticated users can delete"
            on storage.objects for delete
            using (bucket_id = 'photos' and auth.role() = 'authenticated');
          ```

          ### 3. Create Admin User

          1. Go to Authentication → Users in Supabase
          2. Click "Add user"
          3. Choose "Create new user"
          4. Enter email and password
          5. Click "Create user"

          ### 4. Test the Admin Panel

          1. Upload these files to your website
          2. Go to `https://yoursite.com/admin.html`
          3. Login with your admin credentials
          4. Upload a test photo

          ### 5. Updated Portfolio Pages

          These pages now load photos dynamically:
          - proposal.html (category: proposal)
          - wedding.html (category: wedding)
          - portrait.html (category: portrait)
          - event.html (category: event)
          - sport.html (category: sport)

          ## 🎉 You're Done!

          Your portfolio now has a full admin panel for managing photos without editing code!
          EOF
          echo "✅ Created setup documentation"
      
      - name: Commit changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "🚀 Add Supabase admin panel and dynamic photo loading

