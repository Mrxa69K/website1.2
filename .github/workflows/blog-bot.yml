# Telegram blog assistant. Started by the Telegram bot (api/telegram.js on Vercel, through a
# repository_dispatch "blog-bot") or every Monday morning for the weekly ideas.
# Secrets needed (Settings > Secrets and variables > Actions): GEMINI_API_KEY (free) or ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Optional: GOOGLE_SERVICE_ACCOUNT (Search Console sitemap + indexing check)
name: Blog bot

on:
  schedule:
    - cron: '0 8 * * 1'   # Monday 9:00 Paris (winter time): article ideas
    - cron: '23 9 * * *'  # every day 10:23 Paris: is Google indexing the new articles?
  workflow_dispatch:
  repository_dispatch:
    types: [blog-bot]

permissions:
  contents: write
  pull-requests: write

# Drafts run side by side (picking 3 ideas at once gives 3 drafts). Only publishing, which
# writes to main, waits for the previous one.
concurrency:
  group: ${{ (github.event.client_payload.action == 'publish' || github.event.client_payload.action == 'discard') && 'blog-bot-main' || format('blog-bot-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the bot
        run: node automation/bot/run.js
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          SCHEDULE: ${{ github.event.schedule }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
